<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotFetch - Request Builder</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <!-- URL & Send Section -->
    <div class="url-bar-container">
        <select id="method" class="method-select">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
            <option value="PATCH">PATCH</option>
            <option value="HEAD">HEAD</option>
        </select>
        <input type="text" id="url" class="url-input" placeholder="https://api.example.com/v1/resource"
            spellcheck="false">
        <button id="send" class="send-btn">Send</button>
    </div>

    <!-- Action Toolbar -->
    <div class="toolbar">
        <button id="save-btn" class="tool-btn" title="Save to Collection">💾 Save</button>
        <button id="favorite-btn" class="tool-btn" title="Toggle Favorite">⭐</button>
        <button id="export-curl" class="tool-btn" title="Export as cURL">📤 cURL</button>
        <div style="flex: 1"></div>
        <div id="env-badge" class="badge"
            style="font-size: 10px; background: rgba(56, 139, 253, 0.15); color: #58a6ff;">No Environment</div>
    </div>

    <!-- Main Request Tabs -->
    <div class="tabs-container">
        <div class="tab-header">
            <button class="tab-btn active" data-tab="params">Params</button>
            <button class="tab-btn" data-tab="headers">Headers</button>
            <button class="tab-btn" data-tab="auth">Auth</button>
            <button class="tab-btn" data-tab="body">Body</button>
            <button class="tab-btn" data-tab="notes">Notes</button>
            <button class="tab-btn" data-tab="settings">⚙️ Settings</button>
        </div>

        <!-- Params Tab -->
        <div id="params-tab" class="tab-content active">
            <div id="params-list">
                <!-- Dynamic rows here -->
            </div>
            <button id="add-param" class="tool-btn" style="margin-top: 8px;">+ Add Parameter</button>
        </div>

        <!-- Headers Tab -->
        <div id="headers-tab" class="tab-content">
            <textarea id="headers" class="url-input" style="height: 100%; resize: none;"
                placeholder="Key: Value"></textarea>
        </div>

        <!-- Auth Tab -->
        <div id="auth-tab" class="tab-content">
            <select id="auth-type" class="method-select" style="width: 200px; margin-bottom: 12px;">
                <option value="none">No Auth</option>
                <option value="basic">Basic Auth</option>
                <option value="bearer">Bearer Token</option>
            </select>
            <div id="auth-fields"></div>
        </div>

        <!-- Body Tab -->
        <div id="body-tab" class="tab-content">
            <textarea id="body" class="url-input" style="height: 100%; resize: none;"
                placeholder='{ "id": 123 }'></textarea>
        </div>

        <!-- Notes Tab -->
        <div id="notes-tab" class="tab-content">
            <textarea id="notes" class="url-input" style="height: 100%; resize: none;"
                placeholder="Add documentation..."></textarea>
        </div>

        <!-- Settings Tab -->
        <div id="settings-tab" class="tab-content">
            <div style="display:flex; flex-direction:column; gap:16px; padding: 12px;">
                <div>
                    <label style="display:block; margin-bottom:4px; font-size:12px;" class="fg-muted">Retry Count on
                        Network Failure (0-5)</label>
                    <input type="number" id="retry-count" class="url-input" style="width: 150px; padding: 6px;" min="0"
                        max="5" value="0">
                </div>
                <div>
                    <label style="display:block; margin-bottom:4px; font-size:12px;" class="fg-muted">Timeout
                        (ms)</label>
                    <input type="number" id="timeout" class="url-input" style="width: 150px; padding: 6px;" min="1000"
                        max="300000" value="10000">
                </div>
            </div>
        </div>
    </div>

    <!-- Response Pane -->
    <div id="response-container" class="response-container">
        <div class="response-header">
            <div class="response-meta">
                <span>Response</span>
                <span id="status-badge" class="badge">---</span>
                <span id="time-badge" class="fg-muted">-- ms</span>
                <span id="size-badge" class="fg-muted">-- KB</span>
            </div>
            <div class="response-actions">
                <button id="copy-response" class="tool-btn" style="padding: 2px 8px;">Copy</button>
            </div>
        </div>
        <div id="response-body" class="response-body">
            <div class="fg-muted" style="text-align: center; margin-top: 20px;">Send a request to see the response</div>
        </div>
    </div>

    <!-- Modals (Hidden by default) -->
    <div id="save-modal"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center;">
        <div class="glass" style="padding: 24px; border-radius: 8px; width: 320px;">
            <h3 style="margin: 0 0 16px 0;">Save Request</h3>
            <input type="text" id="save-name" class="url-input" style="width: 100%; margin-bottom: 12px;"
                placeholder="Request name">
            <select id="save-collection" class="method-select" style="width: 100%; margin-bottom: 16px;"></select>
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button id="cancel-save" class="tool-btn">Cancel</button>
                <button id="confirm-save" class="send-btn" style="padding: 6px 16px;">Save</button>
            </div>
        </div>
    </div>

    <script src="./logger.js"></script>
    <script src="./script.js"></script>
</body>

</html>
